# ============================================================
# Release — Move Major Version Tag
# Repository : <ORG>/gcp-project-onboarding
#
# Triggered by pushing a semver tag (e.g. v1.2.3).
# Automatically moves the major-version tag (e.g. v1) forward
# so callers pinned to @v1 receive the latest patch automatically.
#
# Usage:
#   git tag v1.2.3
#   git push origin v1.2.3
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Move major version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major version tag
        run: |
          FULL_TAG="${{ github.ref_name }}"
          MAJOR_TAG=$(echo "$FULL_TAG" | cut -d. -f1)

          echo "Full tag : $FULL_TAG"
          echo "Major tag: $MAJOR_TAG"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG"
          git push origin "$MAJOR_TAG" --force

          echo "Tag '$MAJOR_TAG' now points to $(git rev-parse HEAD)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest